<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Evan Patchouli Space —— 一场关于星空的动态展示。" />
    <title>Evan Patchouli Space</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-deep: #05060f;
        --bg-mid: #0b1030;
        --text-main: #edf1ff;
        --text-dim: rgba(210, 220, 255, 0.55);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background:
          radial-gradient(ellipse 120% 90% at 50% 110%, #1a1040 0%, transparent 55%),
          radial-gradient(ellipse 90% 70% at 85% 10%, #0d1b4a 0%, transparent 50%),
          radial-gradient(ellipse 80% 60% at 10% 20%, #160a33 0%, transparent 45%),
          linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 70%);
        color: var(--text-main);
        font-family: Inter, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      #app,
      #app canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #app canvas {
        display: block;
        touch-action: none;
        cursor: grab;
      }

      #app canvas:active {
        cursor: grabbing;
      }

      .overlay,
      #labels {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .hero {
        position: fixed;
        z-index: 3;
        top: 2%;
        left: 0;
        width: 100%;
        text-align: center;
        pointer-events: none;
      }

      .hero h1 {
        font-size: clamp(34px, 6vw, 64px);
        font-weight: 200;
        letter-spacing: 0.35em;
        text-indent: 0.35em;
        background: linear-gradient(120deg, #ffffff 20%, #9db9ff 50%, #ffffff 80%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shine 7s linear infinite;
        text-shadow:
          0 0 40px rgba(130, 165, 255, 0.5),
          0 0 20px rgba(157, 185, 255, 0.4),
          0 0 10px rgba(255, 255, 255, 0.3);
        filter: drop-shadow(0 0 8px rgba(157, 185, 255, 0.6));
      }

      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }

      .hero p {
        margin-top: 18px;
        font-size: clamp(12px, 1.6vw, 15px);
        letter-spacing: 0.5em;
        text-indent: 0.5em;
        color: var(--text-dim);
        animation: fadeUp 2.4s ease 0.6s both;
        text-shadow:
          0 0 20px rgba(130, 165, 255, 0.35),
          0 0 10px rgba(157, 185, 255, 0.25),
          0 0 5px rgba(255, 255, 255, 0.2);
        filter: drop-shadow(0 0 6px rgba(157, 185, 255, 0.4));
      }

      .hero p.subtitle-transition {
        animation: none;
        transition:
          opacity 0.8s ease,
          transform 0.8s ease;
      }

      .hero p.fade-out {
        opacity: 0;
        transform: translateY(-10px);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .footer {
        position: fixed;
        z-index: 3;
        bottom: 0;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.15em;
        color: rgba(190, 200, 235, 0.45);
        pointer-events: none;
        padding: 16px 0 20px 0;
        backdrop-filter: blur(12px) saturate(1.2) brightness(0.9);
        -webkit-backdrop-filter: blur(12px) saturate(1.2) brightness(0.9);
        background: linear-gradient(to top, rgba(0, 0, 20, 0.15), transparent);
      }

      .footer .credit {
        display: block;
        margin-top: 6px;
        font-size: 10px;
        color: rgba(190, 200, 235, 0.28);
      }

      .interaction-hint,
      .scale-note {
        position: absolute;
        bottom: 78px;
        margin: 0;
        color: var(--text-dim);
        font-size: 10px;
        line-height: 1.7;
        letter-spacing: 0.1em;
      }

      .interaction-hint {
        right: 32px;
        text-align: right;
      }

      .scale-note {
        left: 32px;
        max-width: 430px;
      }

      .scale-note a {
        color: rgba(205, 216, 255, 0.72);
        text-decoration-color: rgba(205, 216, 255, 0.28);
        pointer-events: auto;
      }

      .planet-label {
        position: absolute;
        top: 0;
        left: 0;
        padding: 3px 6px;
        color: rgba(224, 231, 255, 0.72);
        font-size: 10px;
        letter-spacing: 0.12em;
        white-space: nowrap;
        text-shadow:
          0 1px 4px #02030b,
          0 0 10px #02030b;
        transition: opacity 160ms ease;
        will-change: transform, opacity;
      }

      .loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: transparent;
        color: var(--text-dim);
        font-size: 10px;
        letter-spacing: 0.26em;
        transition:
          opacity 500ms ease,
          visibility 500ms ease;
      }

      body.ready .loading {
        visibility: hidden;
        opacity: 0;
      }

      @media (max-width: 720px) {
        .interaction-hint {
          right: 18px;
          bottom: 130px;
        }
        .scale-note {
          left: 18px;
          bottom: 130px;
          max-width: 58vw;
          font-size: 8px;
        }
        .planet-label {
          font-size: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.min.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app" aria-label="可交互的三维太阳系"></main>
    <div id="labels" aria-hidden="true"></div>

    <div class="overlay">
      <div class="hero">
        <h1>EVAN PATCHOULI</h1>
        <p id="subtitle">一 方 星 空 · 静 待 启 程</p>
      </div>

      <p class="scale-note">
        轨道形状、倾角、方向及相对周期依据 JPL 轨道根数；为便于观察，轨道间距与天体尺寸采用不同的可视化比例。
        <a href="https://ssd.jpl.nasa.gov/planets/approx_pos.html" target="_blank" rel="noreferrer">数据说明</a>
      </p>

      <p class="interaction-hint">拖拽旋转视角<br />滚轮缩放距离</p>
      <div class="loading" role="status">正在建立太阳系</div>
    </div>

    <div class="footer">
      © 2026 Evan Patchouli Space&nbsp;&nbsp;|&nbsp;&nbsp;
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer">浙ICP备2026072183号</a>
      <span class="credit">Planet textures: Solar System Scope (CC BY 4.0), based on NASA/JPL imagery</span>
    </div>

    <noscript>此页面需要启用 JavaScript 才能显示三维太阳系。</noscript>
    <script>
      // 副标题轮换
      (function () {
        const subtitles = ["一 方 星 空 · 静 待 启 程", "仰 望 星 空 · 跬 步 千 里", "星 河 烂 漫 · 不 尽 于 此"];
        let currentIndex = 0;
        const subtitleElement = document.getElementById("subtitle");
        let firstChange = true;

        function changeSubtitle() {
          // 第一次切换时，将 animation 切换为 transition
          if (firstChange) {
            subtitleElement.classList.add("subtitle-transition");
            firstChange = false;
          }

          // 淡出
          subtitleElement.classList.add("fade-out");

          setTimeout(() => {
            // 切换文本
            currentIndex = (currentIndex + 1) % subtitles.length;
            subtitleElement.textContent = subtitles[currentIndex];

            // 淡入
            subtitleElement.classList.remove("fade-out");
          }, 800); // 与 CSS transition 时间一致
        }

        setInterval(changeSubtitle, 10000);
      })();
    </script>
    <script type="module" src="./solar-system.js"></script>
  </body>
</html>
